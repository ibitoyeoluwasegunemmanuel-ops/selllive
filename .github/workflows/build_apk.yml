name: Build SellLive APK

on:
  push:
    branches: [ main ]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Create google-services.json placeholder
        working-directory: flutter_app/android/app
        run: |
          if [ ! -f google-services.json ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON || "{\"project_info\":{\"project_number\":\"000000000000\",\"project_id\":\"selllive-placeholder\",\"storage_bucket\":\"selllive-placeholder.appspot.com\"},\"client\":[{\"client_info\":{\"mobilesdk_app_id\":\"1:000000000000:android:0000000000000000\",\"android_client_info\":{\"package_name\":\"ng.selllive.app\"}},\"api_key\":[{\"current_key\":\"placeholder\"}],\"services\":{\"appinvite_service\":{\"other_platform_oauth_client\":[]}}}],\"configuration_version\":\"1\"}" }}' > google-services.json
          fi

      - name: Create keystore
        working-directory: flutter_app/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/selllive-release.jks

      - name: Create key.properties
        working-directory: flutter_app/android
        run: |
          cat > key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=selllive-release.jks
          EOF

      - name: Build release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://selllive.vercel.app/api \
            --dart-define=SUPABASE_URL=https://aayprwxhzbhmghvgaeyi.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
             artifacts/SellLive-v1.0-$(date +%Y%m%d).apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SellLive-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SellLive v1.0.${{ github.run_number }}
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
