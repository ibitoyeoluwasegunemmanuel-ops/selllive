name: Build SellLive APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Java 17 ──────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Flutter ──────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      # ── 4. Install dependencies ───────────────────────────────
      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      # ── 5. Create keystore from GitHub secret ─────────────────
      - name: Create keystore
        working-directory: flutter_app/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > selllive-release.jks
          echo "storeFile=selllive-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      # ── 6. Build Release APK ──────────────────────────────────
      - name: Build APK
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://aayprwxhzbhmghvgaeyi.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE_URL=https://selllive.vercel.app/api

      # ── 7. Build App Bundle (for Google Play) ─────────────────
      - name: Build App Bundle
        working-directory: flutter_app
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://aayprwxhzbhmghvgaeyi.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=API_BASE_URL=https://selllive.vercel.app/api

      # ── 8. Rename outputs with version ───────────────────────
      - name: Rename build outputs
        run: |
          VERSION=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)
          mkdir -p releases
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk releases/SellLive-$VERSION.apk
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab releases/SellLive-$VERSION.aab
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_PATH=releases/SellLive-$VERSION.apk" >> $GITHUB_ENV
          echo "AAB_PATH=releases/SellLive-$VERSION.aab" >> $GITHUB_ENV

      # ── 9. Upload APK as downloadable artifact ────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellLive-APK-${{ env.VERSION }}
          path: releases/SellLive-${{ env.VERSION }}.apk
          retention-days: 30

      # ── 10. Upload AAB artifact ───────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellLive-AAB-${{ env.VERSION }}
          path: releases/SellLive-${{ env.VERSION }}.aab
          retention-days: 30

      # ── 11. Create GitHub Release with APK attached ───────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION }}
          name: SellLive v${{ env.VERSION }}
          body: |
            ## SellLive Android Build

            **Built from:** `${{ github.sha }}`
            **Date:** ${{ github.run_started_at }}

            ### Install
            Download the APK below and install on your Android phone.
            Enable "Install from unknown sources" in Settings if prompted.

            ### Files
            - `SellLive-*.apk` — Install directly on Android phone
            - `SellLive-*.aab` — Upload to Google Play Store

            ### What's in this build
            - Live streaming (sellers go live from phone)
            - Real-time chat + BUY command
            - Flutterwave payment integration
            - Push notifications when followed sellers go live
            - Supabase real-time order tracking
          files: |
            releases/SellLive-${{ env.VERSION }}.apk
            releases/SellLive-${{ env.VERSION }}.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Build summary ──────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ SellLive APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** \`${{ env.APK_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(du -sh releases/SellLive-${{ env.VERSION }}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the **Artifacts** section below or from **Releases**." >> $GITHUB_STEP_SUMMARY
